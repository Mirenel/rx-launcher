[package]
name = "rx-launcher"
version = "0.1.3"
description = "Project Rx Launcher"
authors = ["Project Rx"]
edition = "2021"
rust-version = "1.85"
default-run = "rx-launcher"

[lib]
name = "rx_launcher_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
time = { version = "=0.3.36", features = ["parsing"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
zip = "2"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the official single-instance plugin compatible with the project's Rust 1.85 MSRV.
zbus = "=5.13.0"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
