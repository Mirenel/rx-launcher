[package]
name = "rx-launcher"
version = "0.1.0"
description = "Project Rx Launcher"
authors = ["Project Rx"]
edition = "2021"

[lib]
name = "rx_launcher_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
url = "2"
sha2 = "0.10"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
zip = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
